# 品牌提取正则形态（SOP 3.5 规则 #6：中文品牌漏提取）
# 权威载体：新增一种品牌书写形态，只需在此追加正则。
# ⚠️ 同步关系：none_tokens 须与 core/constants.py 的 DEFAULT_NONE_TOKENS 一致。
# ⚠️ 口径语义不变（SOP 3.4 补充约定：标签无出口标识 → 视为"无品牌"）。

# 品牌提取正则（**按顺序尝试，先严格后宽松**）
# 每条：name（唯一标识） / regex（含 1 个捕获组 = 品牌值） / note（说明）
patterns:
  - name: ascii_colon
    # 品牌:COOCAA / 品牌：baori
    regex: '品牌\s*[:：]\s*([A-Za-z0-9\-\.]+)'
    note: 品牌 + 冒号（半角或全角）+ ASCII 品牌

  - name: ascii_spaced
    # Brand:SAMSUNG / BRAND : SAMSUNG
    regex: '(?:Brand|BRAND)\s*[:：]\s*([A-Za-z0-9\-\.]+)'
    note: 英文 Brand 标签 + ASCII 品牌

  - name: chinese_colon
    # 品牌：宇同 / 品牌:宇同
    regex: '品牌\s*[:：]\s*([\u4e00-\u9fa5]{2,})'
    note: 品牌 + 冒号 + 中文品牌

  - name: single_char_pai
    # SAMSUNG牌 —— 单"牌"字格式（SOP 附录 A.3 新增）
    regex: '([A-Za-z0-9\u4e00-\u9fa5][A-Za-z0-9\u4e00-\u9fa5\-\.]{0,20})牌'
    note: 品牌值 + "牌"后缀（如 SAMSUNG牌 / 宇同牌）

  - name: chinese_suffix
    # 宇同品牌 —— 中文品牌 + "品牌"后缀（SOP 附录 A.4 新增）
    regex: '([\u4e00-\u9fa5]{2,})\s*品牌'
    note: 中文品牌 + "品牌"后缀（如 宇同品牌）

  - name: bare_ascii_allcaps
    # 兜底：独立的全大写 ASCII 品牌串（4–20 位），需前置校验避免误捕
    regex: '(?:^|[\s;；|、])([A-Z][A-Z0-9\-\.]{3,19})(?:$|[\s;；|、])'
    note: 宽松兜底，命中后仍需经黑名单与"适用于"语境护栏过滤

# ── 显式「无」标记（⚠️ 口径 v0.3.2，用户裁定 2026-09-17）────────────────
# 语义：**图片侧**出现显式的「无品牌 / 无型号」标记。当**申报侧**该要素为「无」
#       （或申报要素里根本没有该要素）时，双方构成"均为无"的一致证据 → 核验通过。
#
# ⚠️ 优先级（用户裁定）：显式「无」标记是**标签本体的直接证据**，其效力**高于**
#    同一票图中其他位置识别到的品牌/型号文字（唛头 `SKYWORTH P/N`、外箱
#    `Brand:Daewoo` 等）—— 后者仍在「判定依据」列留痕，仅供人工追溯。
#
# ⚠️ 护栏（防虚高）：值侧必须落在**行尾或分隔符边界**上，否则 `品牌:无锡机电`
#    会因前缀 `无` 被误判为「无」标记 → 直接违反「不虚高」红线。
#
# 每条：name（唯一标识） / field（所属要素，取 core.constants.FIELD_*） /
#       regex（**无捕获组**，命中即成立） / note（说明）
none_markers:
  - name: brand_labeled
    field: 品牌
    # 品牌:无 / 品牌:无品牌 / 品牌：无品 / Brand:NONE / Brand: N/A
    regex: '(?:品牌|Brand|BRAND)[ \t]*[:：]?[ \t]*(?:无品牌|无品|无|空|未标记|N/?A|NONE|NULL)[ \t]*(?=$|[\s,，。;；、|/\\])'
    note: 品牌字段行的取值为「无」类（品牌:无 / 品牌：无品牌 / Brand:NONE）

  - name: brand_bare
    field: 品牌
    # 独立成段：无品牌 / 无品。 / 无品牌|型号:xxx
    regex: '^[ \t]*无[ \t]*(?:品牌|品)[ \t]*(?=$|[\s,，。;；、|/\\])'
    note: 行首的「无品牌 / 无品」独立标记

  - name: model_labeled
    field: 型号
    # 型号:无 / 型号：无型号 / 规格型号:无 / Model:NONE
    regex: '(?:型号|规格型号|产品型号|制造商型号|Model|MODEL)[ \t]*[:：]?[ \t]*(?:无型号|无|空|未标记|N/?A|NONE|NULL)[ \t]*(?=$|[\s,，。;；、|/\\])'
    note: 型号字段行的取值为「无」类（型号:无 / 型号：无型号 / Model:NONE）

  - name: model_bare
    field: 型号
    # 独立成段：无型号 / 无型号、用途:xxx
    regex: '^[ \t]*无[ \t]*型号[ \t]*(?=$|[\s,，。;；、|/\\])'
    note: 行首的「无型号」独立标记

# 视为"无品牌"的取值（SOP 3.4 补充约定 + 陷阱#7：标签品牌字段留空率极高）
# 命中 → 判为"无品牌"，不得据此判异常
# ⚠️ 裁决（缺陷 D，架构裁决文档第 5 节）：**已追加** `无品`。
#    `无品` 是「无品牌 → 无品」的 OCR 截断残片，语义等同"无品牌"；
#    依 SOP 3.4 补充约定「标签无出口标识 → 视为无品牌」，必须归入 none_tokens，
#    否则"申报为无、识别为 无品"会被误判为 ❌（假异常温床）。
none_tokens:
  - 无
  - 无品牌
  - 空
  - "N/A"
  - "NA"
  - "NONE"
  - "NULL"
  - 未标记
  - 无品
  - ""
