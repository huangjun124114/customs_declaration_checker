# 字段名黑名单（SOP 3.5 规则 #1 / #3）
# 权威载体：补规则只需在此追加，**无需改 Python 代码**（v1.1 C，快速迭代）。
# ⚠️ 同步关系：本文件内容须与 core/constants.py 的
#    DEFAULT_FIELD_BLACKLIST / DEFAULT_SKIP_PREFIXES 保持一致，
#    由 tests/test_rule_repository.py 断言（防两处漂移）。
# ⚠️ 口径语义不变：本文件只提供"什么算字段名/语境词"的实现条目。

# 字段名黑名单：提取到的"值"若命中则判为空（SOP 3.5 规则#1）
# 例：OCR 把 "制造商全称" 这一字段名误当作品牌值 → 命中 → 判为空
#
# ⚠️ 裁决（缺陷 C / 口径问题 2，架构裁决文档第 4.3 / 6.2 节）：**已追加**下列字段名。
#    这些是实测中"被 OCR 当作品牌值"的字段名残片（如 `SKYWORTH P/N` 实为
#    `创维物料编号` 的英文字段名），命中 → 识别值置空 → 图片侧无本体标识 → ⚠️（非 ❌）。
terms:
  - 制造商全称
  - 原产地
  - "MFR P/N"
  - "MFR P/N:"
  - "Supplier Code"
  - 创维物料编号
  - 制造商
  - 生产厂商
  - "SKYWORTH P/N"
  - "SKYWORTH P/H"
  - "IFR PIN"
  - Manufacturer
  - "Manufacturer Name"
  - "Supplier Name"
  - "Supplier Address"
  - "Manufacturer Address"
  # ⚠️ 缺陷 C / 口径 2 追加（T06 实测 seq=8/16）：P/N 行正则把字段名前缀 ``MFR``
  #    （及其 OCR 误读 ``MWFR``）捕获为"品牌"，命中 → 识别值置空 → ⚠️（非 ❌）。
  - MFR
  - MWFR
  - IFR

# 语境排除：捕获词前若含这些词则跳过（SOP 3.5 规则#5）
# 例："适用于PHILIPS电视机" → 是适配对象，不是申报品牌
skip_prefixes:
  - 适用于
  - 用于
  - 适用
  - 适配
