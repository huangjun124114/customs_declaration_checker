# 型号清洗规则（SOP 3.5 规则 #7：型号脏尾）
# 权威载体：脏尾字符集 / 头部锚定策略在此配置。
# ⚠️ 同步关系：dirty_tail_chars 须与 core/constants.py 的 DEFAULT_DIRTY_TAIL_CHARS 一致。
# ⚠️ **核心约束**：必须"从头部锚定首个 ASCII 型号主体"，
#    绝**不可**用贪婪 `.*` 截断 —— 会误伤 `2.402GHz`（把型号截成 `2.402`）。

# 头部锚定：从字符串首部开始匹配型号主体的正则
# 允许：字母/数字/连字符/下划线/点（点用于 2.402GHz 这类含小数点的型号）
anchor_regex: '^[A-Za-z0-9][A-Za-z0-9\-_\.]{1,39}'

# 脏尾字符集：型号主体结束的分界（命中即截断）
# 例：'A7A01G ，电视机用/' → 'A7A01G'
dirty_tail_chars:
  - "，"
  - ","
  - "/"
  - "\\"
  - "；"
  - ";"
  - "（"
  - "("
  - "）"
  - ")"
  - "【"
  - "】"
  - " "
  - 蓝牙
  - 遥控器

# 保护模式：这些形态**不得**被截断（防止误伤）
protect_patterns:
  # 频率/功率等带单位的数值（如 2.402GHz / 300W）
  - '^\d+(?:\.\d+)?(?:GHz|MHz|KHz|Hz|W|KW|V|A|mA|mm|cm|kg|g)$'
  # 含小数点的型号（如 HS-8A50J-12 / 2.402GHz）
  - '^\d+\.\d+[A-Za-z]*$'

# 型号列名（用于申报要素文本中定位型号字段）
model_field_names:
  - 型号
  - 规格型号
  - 产品型号
  - Model
  - MODEL
  - Customermodel
  - 制造商型号
