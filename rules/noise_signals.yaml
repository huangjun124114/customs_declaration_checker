# 疑似噪声信号（SOP 3.5 + NoiseGuard + v1.2 第 13.5.2 节实测）
# ⚠️ **口径不变，仅补实现条目**：SOP 1.3 已明确「OCR 证据不足（残片、噪声大）→ ⚠️」；
#    本文件只是把"什么算噪声"落成可执行条目。
# ⚠️ 同步关系：confusable_chars / fuzzy_* 须与 core/constants.py 的
#    DEFAULT_CONFUSABLE_CHARS / DEFAULT_FUZZY_MAX_EDIT_DISTANCE /
#    DEFAULT_FUZZY_MIN_LENGTH 一致。

# ── 易混字符归一化（SOP 陷阱#6 + v1.2 实测）──────────────────────────
# 每组内字符视为等价；比对前把双方都归一化为"组内首个字符"再比。
# 实测复现：SKYWORTH → SKYHORTH（W→H 误读）、P/N → P/H（N→H 误读）
confusable_chars:
  - ["O", "0"]
  - ["I", "1", "l"]
  - ["W", "H"]      # ← 实测 SKYWORTH → SKYHORTH
  - ["N", "H"]      # ← 实测 P/N → P/H
  - ["9", "K"]
  - ["8", "B"]
  - ["S", "5"]
  - ["G", "6"]

# ── 模糊相似度（v1.2 第 13.5.2 节）──────────────────────────────────
# 命中条件：编辑距离 ≤ max_edit_distance **且** 双方长度均 ≥ min_length
# 命中后：强制 SUSPICIOUS → ⚠️，**绝不直达 ❌**（不虚高红线）
fuzzy_similarity:
  max_edit_distance: 2       # 编辑距离 ≤ 2 视为疑似噪声
  min_length: 5              # 且长度 ≥ 5（短串太易误判）
  verdict: SUSPICIOUS        # 命中 → 强制 ⚠️

# ── 其它噪声信号 ────────────────────────────────────────────────────
# 低置信度：OCR 置信度低于该阈值 → 优先视为 SUSPICIOUS
low_confidence_threshold: 0.5

# 残片信号：识别文本过短（字符数 < 该值）且不含数字/字母主体 → 视为残片
fragment_min_chars: 2

# 实测噪声样本（回归集用，供 tests 断言"绝不判 ❌"）
# ⚠️ R4（裁决 2 + 缺陷 F，架构裁决文档 §4.6 / §5B）：
#   * `ocr`          —— 样本"整行"形态（实测原样，如 `SKYHORTH P/H`）；
#   * `ocr_prefix`   —— **运行期粒度**形态（`extract_detected_brand` ② 取 P/N 行前缀，
#                       如 `SKYHORTH`）。粒度对齐后，运行期前缀可直接命中（缺陷 F）；
#   * `expected_actual` —— **纠正后确定值**（裁决 2 首次启用）：命中后据此纠正识别值
#                       再与申报值比对（一致 → ✅；不一致 → ❌），不再直接判 ⚠️。
known_noise_samples:
  - ocr: "SKYHORTH P/H"          # 应为 SKYWORTH P/N
    ocr_prefix: "SKYHORTH"
    expected_actual: "SKYWORTH P/N"
    note: "W→H、N→H 双字符误读（v1.2 实测复现）"
  - ocr: "IFR PIN"
    ocr_prefix: "IFR"
    expected_actual: "SKYWORTH P/N"
    note: "字段名整体误读（SOP 附录 A.4）"
  - ocr: "boori E339609"
    ocr_prefix: "boori"
    expected_actual: "baori"
    note: "等价证据：OCR 噪声 + 型号后缀（SOP 附录 A.4）"
  - ocr: "600-CX9"
    ocr_prefix: "600-CX9"
    expected_actual: "GXD-009"
    note: "倒置插头，OCR 读反（SOP 附录 A.3）"
