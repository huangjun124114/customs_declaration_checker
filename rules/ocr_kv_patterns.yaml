# OCR 键值对（KV）提取规则（v0.2.0 点 8 的 KV 部分 / 方案 §3.4）
# ──────────────────────────────────────────────────────────────────────
# 用途：把单张图的 OCR 行解析为「键 → 值」，随 OCR 缓存落盘，并供工作台展示。
#
# ⚠️ **KV 不参与判定**（Q4 已决）：判定仍走原跨图投票链路，KV 的出口只有两个：
#     ① 详细 JSON 日志；② 复核工作台展示。
#
# ⚠️ **规则外置（C2 原则）**：补规则 = 改本 YAML，**无需改代码**。
#     `core/kv_extractor.py` 的 `default_kv_rules()` 是 **YAML 缺失时的兜底**，
#     与本文档内容**必须等价**（由回归锁 `test_kv_rules_default_and_repo_agree`
#     断言，防"打包漏 YAML → 静默失效"，即历史缺陷 F 的教训）。
#
# ⚠️ **黑名单复用**：字段名黑名单 / 非品牌裸 token **不在此重复维护**，
#     由 `core/kv_extractor.py` 直接复用 `core/constants.py` 的
#     `DEFAULT_FIELD_BLACKLIST` / `DEFAULT_NON_BRAND_TOKENS`（可被用户外置覆盖）。
#     本文件的 `noise_terms` 只是**额外**的 KV 级噪声词。

# ── 字段别名表（中英）────────────────────────────────────────────────
# 键 = 规范字段名（仅供分组/调试）；值 = 该字段在唛头/标签上可能出现的别名形态。
# 说明：提取出的 KV **保留原始键文本**（如 `品牌：创维` → {"品牌": "创维"}），
#       别名表用于「识别这是不是一个字段键」（尤其对空白分隔的弱分隔场景做白名单）。
field_aliases:
  Brand: ["Brand", "BRAND", "品牌", "牌"]
  Model: ["Model", "MODEL", "型号", "规格型号", "产品型号", "制造商型号"]
  MFR P/N: ["MFR P/N", "MFR PIN", "MFR/PN", "制造商料号", "制造商 P/N"]
  P/N: ["P/N", "P/H", "PIN", "料号", "物料编号", "成品料号", "创维物料编号", "SKYWORTH P/N", "SKYWORTH P/H"]
  Customer model: ["Customer model", "Customermodel", "客户型号"]
  Quantity: ["QTY", "数量", "订购数量"]
  Weight: ["重量", "毛重", "净重"]
  Origin: ["Origin", "原产地", "产地"]
  Manufacturer: ["Manufacturer", "Manufacturer Name", "制造商", "制造商全称", "生产厂商"]
  Supplier: ["Supplier", "Supplier Code", "Supplier Name", "供应商"]
  Description: ["Description", "DESCRIPTION", "品名", "名称", "中文品名"]
  Date: ["Date", "DATE", "日期", "生产日期"]
  Serial: ["Serial", "Serial No.", "Serial No", "序列号"]

# ── 分隔符集合（键与值的分界）────────────────────────────────────────
# 半角冒号 / 全角冒号 / 等号；空白分隔（连续 ≥ whitespace_separator_min 个空格）另计。
separators: [":", "：", "="]

# 连续空白视为分隔符的最小空格数（弱分隔，键须命中别名白名单才采信）
whitespace_separator_min: 2

# ── 噪声词表（KV 级，额外于 constants 的黑名单 / non_brand）──────────
# 这些是 UI 图标文字 / 应用名——整行命中则判为噪声（不进 KV，进 residue）。
noise_terms: ["prime video", "YouTube", "NETFLIX", "Spotify", "Prime Video"]
